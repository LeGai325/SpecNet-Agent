name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: specnet_plotting/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r specnet_plotting/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q specnet_agent_experiments specnet_plotting tools
      - name: Test controller and training
        run: python -m unittest discover -s specnet_agent_experiments -p 'test_*.py'
      - name: Test analysis tools
        run: python -m unittest discover -s specnet_plotting -p 'test_*.py'
