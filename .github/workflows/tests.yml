name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development dependencies
        run: python -m pip install -e ".[plot,dev]"
      - name: Compile Python sources
        run: python -m compileall -q src specnet_agent_experiments specnet_plotting tools tests
      - name: Ruff
        run: python -m ruff check src tests
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Historical experiment entry tests
        run: python -m unittest discover -s specnet_agent_experiments -p "test_*.py"
      - name: Historical analysis entry tests
        run: python -m unittest discover -s specnet_plotting -p "test_*.py"
      - name: CLI contract smoke test
        run: specnet-run --config configs/smoke.json --duration 40 --max-workflows 0 --max-time 80 --train-episodes 1 --eval-runs 1 --loads light --output-dir outputs/ci-smoke
